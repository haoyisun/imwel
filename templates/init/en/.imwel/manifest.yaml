# imwel manifest — declares projects and directory conventions.
# See https://github.com/haoyisun/imwel for documentation.

conventions:
  # Default directory names (per-project overrides allowed)
  rulesDir: rules
  skillsDir: skills
  agentsFile: agents.md

projects:
  - name: example-project
    path: example-project
    # role: shared     -> read-only module, consumers install-and-sync but never push edits back
    # role: project     -> writable project, a consumer directory binds at most one (default when omitted)
    role: project
    optional:
      - skills/example-skill
  # Add more projects to publish reusable, read-only modules alongside the
  # writable project above (e.g. a shared style/convention pack):
  # - name: example-module
  #   path: example-module
  #   role: shared
