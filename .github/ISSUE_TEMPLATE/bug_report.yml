name: Bug report
description: Report a bug in the imwel CLI
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in the sections below.
        For security issues, use [Security Advisories](https://github.com/haoyisun/imwel/security/advisories/new) instead of a public issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the problem.
      placeholder: |
        1. Run `imwel ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, imwel version, Git version if relevant.
      placeholder: |
        - OS:
        - Node.js:
        - imwel:
        - Git:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Paste relevant CLI output (redact secrets).
      render: shell
    validations:
      required: false
