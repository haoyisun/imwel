name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run ci
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          test "$TAG" = "$PKG" || { echo "git tag $TAG does not match package.json version $PKG"; exit 1; }
      - name: Publish
        # --provenance emits a signed supply-chain attestation using id-token: write.
        run: npm publish --access public --provenance
        env:
          # Prefer npm Trusted Publisher when configured; otherwise set NPM_TOKEN
          # as a repository secret (https://docs.npmjs.com/about-access-tokens).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
